const K="panel-k-"+D.s.slice(0,8);
const u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function open(key){
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));
  const html=new TextDecoder().decode(pt);
  document.open();document.write(html);document.close();
}
async function fromRaw(raw){return crypto.subtle.importKey("raw",u8(raw),{name:"AES-GCM"},true,["decrypt"]);}
async function derive(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:u8(D.s),iterations:D.it,hash:"SHA-256"},base,{name:"AES-GCM",length:256},true,["decrypt"]);
}
(async()=>{
  let saved=null;try{saved=localStorage.getItem(K)}catch(e){}
  if(saved){try{await open(await fromRaw(saved));return}catch(e){try{localStorage.removeItem(K)}catch(_){}}}
  const f=document.getElementById("f");f.hidden=false;document.getElementById("pw").focus();
  f.addEventListener("submit",async ev=>{
    ev.preventDefault();const b=document.getElementById("go"),er=document.getElementById("err");
    b.disabled=true;b.textContent="Abriendo…";er.textContent="";
    try{
      const key=await derive(document.getElementById("pw").value);
      const raw=b64(await crypto.subtle.exportKey("raw",key));
      await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(D.i)},key,u8(D.c));
      if(document.getElementById("rem").checked){try{localStorage.setItem(K,raw)}catch(e){}}
      await open(key);
    }catch(e){er.textContent="Contraseña incorrecta.";b.disabled=false;b.textContent="Abrir";}
  });
})();
